<div class="form-group">
    <label for="{{ field.id_for_label }}">{{ field.label }} {% if field.field.required %}<span class="asteriskField">*</span>{% endif %}</label>
    <select name="{{ field.html_name }}" id="{{ field.auto_id }}" class="form-control" multiple>
        {% for option in field.field.choices %}
            <option value="{{ option.0 }}" {% if option.0 in field.value %}selected{% endif %}>{{ option.1 }}</option>
        {% endfor %}
    </select>
    {% if field.errors %}
    <div class="d-block invalid-feedback form-errors">
        {% for error in field.errors %} {{error}}<br> {%endfor%}
    </div>
    {% endif %}
    {% if field.help_text %}
      <small class="text-muted mt-2 d-block">{{ field.help_text|safe }}</small>
    {% endif %}
</div>
